<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love Clean Air - Air Quality Maps</title>
<meta name="description" content="Air pollution maps for Croydon, Merton, Richmond upon Thames and Wandsworth, hosted by the South West London Regulatory Services Partnership.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="banner">
  <div class="wrap">
    <img src="LCA_logo.png" alt="Love Clean Air">
    <div>
      <h1>Air pollution maps</h1>
      <p>Hosted by the <a href="https://www.merton.gov.uk/planning-and-buildings/pollution/air-quality-and-air-pollution/local-air-quality-management">Air Quality Team</a> of the <a href="https://www.merton.gov.uk/business-and-consumers/rsp">South West London Regulatory Services Partnership</a></p>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="councils" class="councils"><p class="status">Loading maps…</p></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Maps produced by the <a href="https://www.merton.gov.uk/planning-and-buildings/pollution/air-quality-and-air-pollution/local-air-quality-management">Air Quality Team</a> of the <a href="https://www.merton.gov.uk/business-and-consumers/rsp">South West London Regulatory Services Partnership</a>.</span>
    <a href="archive.html">Archive of earlier map versions</a>
  </div>
</footer>

<script src="site.js"></script>
<script>
// Keep the period ("2020–2025", "15–20 Jan 2024") on one line.
function labelParts(label) {
  const i = label.lastIndexOf(', ');
  return i < 0 ? [label] : [label.slice(0, i + 1) + ' ', el('span', { class: 'nowrap' }, label.slice(i + 2))];
}

function card(map, council) {
  const thumb = map.thumb
    ? el('div', { class: 'thumb' }, el('img', { src: map.thumb, alt: '', loading: 'lazy', width: '640', height: '360' }))
    : el('div', { class: 'thumb none' }, 'No preview yet');
  return el('a', { class: 'card', href: map.file, target: '_blank', rel: 'noopener' },
    thumb,
    el('div', { class: 'body' },
      el('span', { class: 'label' }, ...labelParts(chemText(map.label))),
      map.detail ? el('span', { class: 'detail' }, map.detail) : null,
      el('span', { class: 'open' }, 'Open map ↗')));
}

loadSite().then(({ manifest, repoFiles }) => {
  const known = new Map(manifest.maps.map(m => [m.file, m]));
  // Front page: manifest maps that exist in the repository, plus new *_latest maps not yet in maps.json.
  const files = repoFiles ? repoFiles.filter(isFrontPage) : [...known.keys()];
  const maps = files.map(f => known.get(f) || { file: f, council: councilFor(f, manifest.councils), label: labelFromFile(f) });

  const councils = [...manifest.councils];
  if (maps.some(m => m.council === 'other')) councils.push({ id: 'other', name: 'Other maps', colour: '#55636f', tint: '#eceff2' });

  const root = document.getElementById('councils');
  root.replaceChildren();
  for (const council of councils) {
    const own = maps.filter(m => m.council === council.id).sort((a, b) => a.label.localeCompare(b.label));
    if (!own.length) continue;
    const wide = council.id === 'episodes' || council.id === 'other';
    root.append(councilSection(council, el('div', { class: 'cards' }, ...own.map(m => card(m, council))), wide ? 'wide' : ''));
  }
}).catch(err => {
  console.error(err);
  document.getElementById('councils').replaceChildren(el('p', { class: 'status' }, 'The map list could not be loaded. Please refresh the page.'));
});
</script>
</body>
</html>
